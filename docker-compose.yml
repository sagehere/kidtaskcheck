services:
  app:
    image: ${APP_IMAGE:-ghcr.io/sagehere/kidtaskcheck:latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ENVIRONMENT: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD environment variable}
      APP_URL: ${APP_URL:?set APP_URL environment variable}
      DATABASE_PATH: /app/data/taskcheck.sqlite
      ENABLE_BUILTIN_SCHEDULER: "true"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
